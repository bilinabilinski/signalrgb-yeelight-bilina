name: Test Yeelight Bilina patch
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our patch tools
        uses: actions/checkout@v4
      - name: Clone official upstream sources
        run: git clone --depth 1 https://gitlab.com/signalrgb/yeelight.git upstream
      - name: Apply fixes to upstream
        shell: pwsh
        run: ./patches/Apply-YeelightFix.ps1 -SourceDirectory ./upstream -DestinationDirectory ./build
      - name: Check JavaScript syntax
        run: node --check build/Yeelight.js
      - name: Test integration via service mocks
        run: node tests/test-plugin.cjs build

  windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout patch tools
        uses: actions/checkout@v4
      - name: Clone upstream sources
        run: git clone --depth 1 https://gitlab.com/signalrgb/yeelight.git upstream
      - name: Apply patches with Windows PowerShell 5.1
        shell: powershell
        run: .\patches\Apply-YeelightFix.ps1 -SourceDirectory .\upstream -DestinationDirectory .\build
      - name: Validate JS syntax
        shell: pwsh
        run: node --check build/Yeelight.js
      - name: Run three-lamp regression tests
        shell: pwsh
        run: node tests/test-plugin.cjs build
      - name: Verify TCP native white restoration against mock bulb
        shell: pwsh
        run: node tests/test-white-restore.cjs
      - name: End-to-end installer download and install on Windows
        shell: powershell
        run: .\INSTALL.ps1 -SkipProcessCheck
